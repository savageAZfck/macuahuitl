[package]
name = "macuahuitl"
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["Adam Clark <savagetism@icloud.com>"]
repository = "https://github.com/savageAZfck/macuahuitl"
homepage = "https://github.com/savageAZfck/macuahuitl"
